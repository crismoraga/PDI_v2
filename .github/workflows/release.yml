name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.0)'
        required: true
        default: 'v3.0.0'

jobs:
  build-portable:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create portable package
        run: |
          mkdir -p release-portable
          cp -r zdex release-portable/
          cp run_zdex.py release-portable/
          cp test_detection.py release-portable/ || true
          cp taxonomy_release.txt release-portable/ || true
          cp INSTALAR.bat release-portable/ || true
          cp ZDex.bat release-portable/ || true
          
          # Create requirements.txt
          cat > release-portable/requirements.txt << 'EOF'
          # ZDex - Requisitos minimos
          torch>=2.0.0
          torchvision>=0.15.0
          opencv-python>=4.8.0
          pillow>=9.0.0
          numpy>=1.24.0
          requests>=2.28.0
          ultralytics>=8.0.0
          EOF
          
          # Create ZIP
          cd release-portable && zip -r ../ZDex-Portable.zip . && cd ..
          ls -la *.zip
      
      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: ZDex-Portable
          path: ZDex-Portable.zip

  create-release:
    needs: build-portable
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ZDex-Portable
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "🦁 ZDex ${{ github.ref_name }} — Pokédex Evolution"
          body: |
            # 🦁 ZDex ${{ github.ref_name }}
            
            ## 📥 Descarga
            
            | Archivo | Descripción | Requisitos |
            |:---|:---|:---|
            | **ZDex-Portable.zip** | Código fuente + scripts | Python 3.10+, Windows/Linux/macOS |
            
            ## 🚀 Instalación Rápida (Windows)
            
            1. Descarga `ZDex-Portable.zip`
            2. Extrae el ZIP
            3. Ejecuta `INSTALAR.bat` (instala dependencias)
            4. Ejecuta `ZDex.bat`
            5. ¡Listo! 🎉
            
            > ⚠️ **Primera ejecución:** Los modelos de IA se descargan automáticamente (~500 MB)
            
            ## ✨ Características
            
            - 🔍 Detección en tiempo real con YOLOv12-Turbo
            - 🧬 Clasificación de 3,489 especies con SpeciesNet
            - 🎮 Sistema de gamificación con 10 logros
            - 🌍 Geolocalización automática
            - 📚 Integración con Wikipedia
            - 📊 Framework de evaluación (100K stress test)
            
            ## 📊 Métricas
            
            | Métrica | Resultado |
            |:---|:---|
            | Precisión Top-1 | 87.0% |
            | Latencia media | 2.93s |
            | Especies | 3,489 |
            
            ## 👥 Equipo
            
            Cristóbal Moraga, Clemente Mujica, Camilo Troncoso, Felipe Tapia, Iván Weber
            
            ---
            **Universidad Técnica Federico Santa María — TEL328**
          files: ZDex-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
